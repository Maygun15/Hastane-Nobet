version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: hospital-roster-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://127.0.0.1:27017", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hospital-roster-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./my-backend-project
      dockerfile: Dockerfile
    container_name: hospital-roster-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./my-backend-project/.env
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/hastane
      - REDIS_URL=redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./my-backend-project:/app
      - /app/node_modules

volumes:
  mongo_data:
  redis_data:
