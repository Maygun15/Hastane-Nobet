name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          VITE_API_ENV: prod

      - name: Deploy to Vercel
        # amondnet/vercel-action v25.1.1 — pinned to immutable SHA
        uses: amondnet/vercel-action@9b3b2f6d3924bd8de3e18c7b7b48bd2b879f94db
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: --prod

  deploy-backend:
    name: Deploy Backend → Railway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway
        # bervProject/railway-deploy v3.0.0 — pinned to immutable SHA (not @main)
        uses: bervProject/railway-deploy@d9df2f4ab9cc5ea55a0b1e9640c37e3a428d8ddb
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: ${{ secrets.RAILWAY_SERVICE_NAME }}
