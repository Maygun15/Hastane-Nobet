name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  frontend:
    name: Frontend Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (0 hata zorunlu; uyarılar izlemede)
        run: npm run lint

      - name: Unit tests (node --test)
        run: npm test

      - name: UI tests (vitest)
        run: npm run test:ui

      - name: Security audit (üretim bağımlılıkları)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE || 'http://localhost:3000' }}
          VITE_API_ENV: ci

  backend:
    name: Backend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-backend-project
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-backend-project/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit (üretim bağımlılıkları)
        run: npm audit --omit=dev --audit-level=high

      - name: Syntax check — routes
        run: node --check $(find routes models middleware services -name "*.js" | tr '\n' ' ') index.js

      - name: Run tests
        run: npm test --if-present
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/test
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-test-secret-replace-in-prod' }}
