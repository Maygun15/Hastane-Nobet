name: Deneme ortamı yedeği

# Her gün 05:30 (TSİ) deneme veritabanının yedeği alınır, şifrelenir, AYRI bir geçici veritabanına
# geri yüklenip doğrulanır, uygulama geri yüklenen veriyle açılır, şifreli yedek artifact olarak
# yüklenip geri indirilerek özeti karşılaştırılır. Sonuç EN SONDA deneme veritabanına yazılır
# (ops_meta.backupStatus: lastAttempt her zaman, lastSuccess yalnız tüm adımlar geçtiyse) ve
# /api/version → backup alanında görünür. Başarısız çalışma GitHub tarafından e-postayla bildirilir.
#
# Gerekli depo gizli değerleri — Settings → Secrets and variables → Actions → "Repository secrets"
# (Environment secret ya da Variable OLMAZ; bu iş bir environment'a bağlı değildir):
#   STAGING_MONGODB_URI  deneme veritabanı adresi (Render → nobet-staging-api → Environment → MONGODB_URI)
#   BACKUP_PASSPHRASE    yedek şifreleme parolası (en az 32 karakter; ayrıca güvenli yerde saklanmalı)
#
# Sürüm: GitHub zamanlanmış çalışmayı varsayılan daldaki (main) bu dosyadan başlatır; betikler ise
# her zaman deneme dalından (vercel-preview-stabilizasyon) alınır — deneme sunucusunda çalışan kodla
# aynı betikler. Push tetiklemesinde tam olarak gönderilen commit alınır.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch: {}
  push:
    branches: [vercel-preview-stabilizasyon]

permissions:
  contents: read
  actions: read  # yüklenen artifact'ı REST API ile geri indirmek için (salt okuma)

concurrency:
  group: staging-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-22.04
    timeout-minutes: 60  # Atlas ücretsiz katmanda döküm yavaş olabilir
    services:
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
    defaults:
      run:
        working-directory: my-backend-project
    env:
      STAGING_MONGODB_URI: ${{ secrets.STAGING_MONGODB_URI }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      # runner bağlamı iş düzeyindeki env'de kullanılamaz; dizinler adım içinde belirlenir.
      - name: Çalışma dizinleri
        working-directory: .
        run: |
          echo "BACKUP_DIR=$RUNNER_TEMP/yedek" >> "$GITHUB_ENV"
          echo "RESTORE_DIR=$RUNNER_TEMP/geri" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'vercel-preview-stabilizasyon' }}

      - name: Alınan sürüm
        id: src
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Betik sürümü: $(git rev-parse --short=12 HEAD) (tetikleme: ${{ github.event_name }})"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-backend-project/package-lock.json

      - name: Bağımlılıklar
        run: npm ci --omit=dev

      - name: Gizli değerler tanımlı mı
        id: secrets
        env:
          # Yalnız var/yok bilgisi (değer değil): aynı adla Variable tanımlanmışsa ayrı uyarı verilir.
          HAS_VAR_URI: ${{ vars.STAGING_MONGODB_URI != '' }}
          HAS_VAR_PASSPHRASE: ${{ vars.BACKUP_PASSPHRASE != '' }}
        run: node scripts/checkBackupSecrets.js

      - name: MongoDB veritabanı araçları
        id: tools
        run: |
          curl -fsSL -o /tmp/tools.deb https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.10.0.deb
          sudo apt-get install -y /tmp/tools.deb >/dev/null
          mongodump --version | head -1

      - name: Yedek (ortam işareti doğrulanır)
        id: dump
        run: node scripts/backup.js --target=staging

      - name: Şifrele
        id: enc
        run: |
          A="${{ steps.dump.outputs.archive }}"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$A" -out "$A.enc" -pass env:BACKUP_PASSPHRASE
          sha256sum "$A.enc" | awk '{print $1}' > "$A.enc.sha256"
          rm -f "$A"
          echo "enc=$A.enc" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cat "$A.enc.sha256")" >> "$GITHUB_OUTPUT"
          echo "Şifreli yedek: $(stat -c %s "$A.enc") bayt, sha256 $(cat "$A.enc.sha256")"

      - name: Şifreyi çöz ve ayrı veritabanına geri yükle (sayı, kimlik özeti, dizin)
        id: restore
        run: |
          E="${{ steps.enc.outputs.enc }}"
          mkdir -p "$RESTORE_DIR"
          R="$RESTORE_DIR/$(basename "${E%.enc}")"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$E" -out "$R" -pass env:BACKUP_PASSPHRASE
          cp "${E%.enc}.manifest.json" "$R.manifest.json"
          RESTORE_URI=mongodb://localhost:27017 node scripts/restore-verify.js "$R" hastane --keep

      - name: Uygulama geri yüklenen veriyle açılır ve okur
        id: smoke
        run: |
          MONGODB_URI=mongodb://localhost:27017 node scripts/readSmoke.js
          MONGODB_URI=mongodb://localhost:27017 PORT=3999 NODE_ENV=development SENTRY_DSN= NOTIFICATIONS_ENABLED=false \
            JWT_SECRET="$(openssl rand -hex 32)" JWT_REFRESH_SECRET="$(openssl rand -hex 32)" FRONTEND_ORIGIN=http://localhost \
            node index.js > "$RUNNER_TEMP/api.log" 2>&1 &
          API_PID=$!
          for i in $(seq 1 30); do curl -sf http://localhost:3999/api/health >/dev/null && break; sleep 2; done
          V=$(curl -sf http://localhost:3999/api/version)
          kill "$API_PID" || true
          echo "$V" | node -e "const v=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log('ortam işareti:',v.db.environment,'| güvence dizinleri:',v.ready.ok);if(v.db.environment!=='staging'||v.ready.ok!==true){process.exit(1)}"

      - name: Şifreli yedeği sakla (7 gün)
        id: artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deneme-yedegi-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.BACKUP_DIR }}/*.enc
            ${{ env.BACKUP_DIR }}/*.enc.sha256
            ${{ env.BACKUP_DIR }}/*.manifest.json
          retention-days: 7
          if-no-files-found: error

      # Geri indirme, geri dönüşte bir insanın kullanacağı yolla yapılır: REST API, yükleme kimliği.
      # (actions/download-artifact aynı işte yüklenen artifact'ı bulamadı: 45210040950/2 ada göre,
      #  45266385988 kimliğe göre "not found".) Yüklemeden hemen sonra gecikme olabilir → yeniden dener.
      - name: Artifact geri indirilir (REST API, yükleme kimliğiyle)
        id: download
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ART_ID: ${{ steps.artifact.outputs.artifact-id }}
          ART_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          D="$RUNNER_TEMP/indirilen"; mkdir -p "$D"
          for i in 1 2 3 4 5 6; do
            if curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                 -o "$D/artifact.zip" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ART_ID/zip"; then break; fi
            echo "deneme $i: artifact $ART_ID henüz indirilemedi"; rm -f "$D/artifact.zip"; sleep 10
          done
          [ -s "$D/artifact.zip" ] || { echo "::error::Artifact $ART_ID indirilemedi"; exit 1; }
          ZIP=$(sha256sum "$D/artifact.zip" | awk '{print $1}')
          echo "indirilen zip: $(stat -c %s "$D/artifact.zip") bayt, sha256 $ZIP | yükleme özeti: ${ART_DIGEST:-yok}"
          if [ -n "$ART_DIGEST" ] && [ "${ART_DIGEST#sha256:}" != "$ZIP" ]; then echo "::error::İndirilen zip özeti yükleme özetiyle eşleşmiyor"; exit 1; fi
          unzip -q -o "$D/artifact.zip" -d "$D"

      - name: İndirilen artifact özeti şifreli yedekle aynı mı
        id: artifactCheck
        if: success()
        run: |
          F=$(find "$RUNNER_TEMP/indirilen" -name '*.enc' -type f | head -1)
          [ -n "$F" ] || { echo "::error::İndirilen artifact içinde şifreli yedek yok"; exit 1; }
          GOT=$(sha256sum "$F" | awk '{print $1}')
          echo "artifact kimliği: ${{ steps.artifact.outputs.artifact-id }} | indirilen .enc sha256: $GOT | şifreleme adımındaki: ${{ steps.enc.outputs.sha256 }}"
          [ "$GOT" = "${{ steps.enc.outputs.sha256 }}" ] || { echo "::error::İndirilen artifact özeti şifreli yedekle eşleşmiyor"; exit 1; }

      # Sonuç kaydı EN SONDA: başarı ancak artifact yüklenip geri indirildikten sonra yazılır.
      - name: Sonuç kaydı (son deneme / son başarılı yedek)
        id: record
        if: always()
        continue-on-error: true
        run: >-
          node scripts/recordBackupStatus.js --target=staging
          --steps="secrets:${{ steps.secrets.outcome }},tools:${{ steps.tools.outcome }},dump:${{ steps.dump.outcome }},enc:${{ steps.enc.outcome }},restore:${{ steps.restore.outcome }},smoke:${{ steps.smoke.outcome }},artifact:${{ steps.artifact.outcome }},download:${{ steps.download.outcome }},artifactCheck:${{ steps.artifactCheck.outcome }}"
          --backup-at="${{ steps.dump.outputs.backup_at }}" --backup-docs="${{ steps.dump.outputs.backup_docs }}"
          --restored-docs="${{ steps.restore.outputs.restored_docs }}" --restored-collections="${{ steps.restore.outputs.restored_collections }}"
          --restored-indexes="${{ steps.restore.outputs.restored_indexes }}" --artifact-id="${{ steps.artifact.outputs.artifact-id }}"
          --run-url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}"

      - name: Özet
        if: always()
        run: |
          {
            echo "### Deneme yedeği — çalıştırma ${{ github.run_id }} / deneme ${{ github.run_attempt }}"
            echo "- Betik sürümü: \`${{ steps.src.outputs.commit }}\` (tetikleme: ${{ github.event_name }})"
            echo ""
            echo "| Adım | Sonuç |"
            echo "|---|---|"
            echo "| Gizli değer ön kontrolü | ${{ steps.secrets.outcome }} |"
            echo "| Yedek alma | ${{ steps.dump.outcome }} (${{ steps.dump.outputs.backup_docs }} belge) |"
            echo "| Şifreleme | ${{ steps.enc.outcome }} |"
            echo "| Ayrı veritabanına geri yükleme + veri/dizin doğrulaması | ${{ steps.restore.outcome }} (${{ steps.restore.outputs.restored_collections }} koleksiyon, ${{ steps.restore.outputs.restored_docs }} belge, ${{ steps.restore.outputs.restored_indexes }} dizin) |"
            echo "| Uygulamanın geri yüklenen veriyi okuması | ${{ steps.smoke.outcome }} |"
            echo "| Artifact yükleme | ${{ steps.artifact.outcome }} (kimlik ${{ steps.artifact.outputs.artifact-id }}) |"
            echo "| Artifact geri indirme | ${{ steps.download.outcome }} |"
            echo "| İndirilen dosyanın SHA-256 karşılaştırması | ${{ steps.artifactCheck.outcome }} |"
            echo "| Sonuç kaydı (deneme veritabanı) | ${{ steps.record.outcome }} — yazıldı: ${{ steps.record.outputs.written || 'false' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.record.outputs.written }}" != "true" ]; then
            echo "::error title=KAYIT_YAZILAMADI::Bu çalıştırmanın sonucu deneme veritabanına YAZILAMADI; /api/version bu denemeyi göstermez."
            exit 1
          fi
